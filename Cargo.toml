[workspace]
members = [
    "apps/kiarni",
    "crates/core",
    "crates/engine",
    "crates/storage",
    "crates/auth",
    "crates/config",
    "crates/http",
    "crates/server",
    "crates/feeds",
    "spikes/storage",
    "spikes/feeds",
    "spikes/query",
    "spikes/http-contract",
    "spikes/auth",
    "spikes/transport",
    "spikes/writes",
    "spikes/config",
    "spikes/group-commit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
