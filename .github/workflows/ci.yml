name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Product dependency boundary
        run: python3 scripts/check_product_dependencies.py
      - name: Documentation links and contract inventories
        run: python3 scripts/check_docs.py
      - name: Published documentation examples
        run: |
          cargo build -p kiarni --locked
          python3 scripts/docs_smoke.py --binary target/debug/kiarni
      - name: Benchmark measurement tests
        run: python3 -m unittest discover -s benches -p test_http_load.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard metrics parser tests
        run: node scripts/dashboard-metrics.test.mjs
      - name: Dashboard SSE parser tests
        run: node scripts/dashboard-feed.test.mjs
      - name: Streaming reference client tests
        run: node spikes/streaming/client.test.mjs

  browser:
    name: Chromium loopback transport
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
      - name: Build private fixture
        run: cargo build -p kiarni-transport-spike --example fixture_server --locked
      - name: Install browser test library
        run: npm ci --prefix spikes/transport --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium
        run: spikes/transport/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser transport tests
        run: node spikes/transport/browser.test.mjs
      - name: Build product binary
        run: cargo build -p kiarni --locked
      - name: Embedded dashboard browser test
        run: node scripts/dashboard-browser.test.mjs

  https-proxy:
    name: HTTPS proxy and dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: |
          rustup show active-toolchain
      - name: Build product binary
        run: cargo build -p kiarni --locked
      - name: Obtain Nginx without installing a service
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/kiarni-nginx"
          cd "$RUNNER_TEMP/kiarni-nginx"
          apt-get download nginx
          dpkg-deb -x nginx_*.deb root
          echo "KIARNI_TEST_NGINX=$RUNNER_TEMP/kiarni-nginx/root/usr/sbin/nginx" >> "$GITHUB_ENV"
      - name: Install browser test library
        run: npm ci --prefix spikes/transport --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium
        run: spikes/transport/node_modules/.bin/playwright install --with-deps chromium
      - name: Real HTTPS proxy integration
        run: node scripts/https-proxy.test.mjs

  native-build:
    name: Package (${{ matrix.target }})
    needs: [rust, browser, https-proxy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Packaging contract tests
        run: python3 -m unittest discover -s scripts -p test_release.py
      - name: Build native development archive
        run: python3 scripts/package_release.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  native-smoke:
    name: Artifact (${{ matrix.target }})
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binary-${{ matrix.target }}
          path: downloaded
      - name: Verify and exercise downloaded binary with empty environment
        run: python3 scripts/release_smoke.py --artifact-dir downloaded --expected-target '${{ matrix.target }}'

  container:
    name: Container and Kubernetes
    needs: [native-build, native-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: downloaded
      - name: Verify archive and prepare minimal Docker context
        run: python3 scripts/prepare_container.py --artifact-dir downloaded --output "$RUNNER_TEMP/kiarni-image"
      - name: Build development image without registry publication
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t kiarni:development "$RUNNER_TEMP/kiarni-image"
      - name: Docker Compose lifecycle and backup tests
        run: python3 scripts/container_smoke.py --image kiarni:development
      - name: Install pinned Kubernetes test tools
        run: python3 scripts/install_container_test_tools.py --output "$RUNNER_TEMP/kiarni-tools"
      - name: Real Kubernetes manifest and persistence tests
        run: python3 scripts/kubernetes_smoke.py --image kiarni:development --tools "$RUNNER_TEMP/kiarni-tools"
      - name: Export tested development image
        working-directory: ${{ runner.temp }}
        run: |
          docker image save kiarni:development | gzip -n > kiarni-development-linux-amd64.tar.gz
          sha256sum kiarni-development-linux-amd64.tar.gz > kiarni-development-linux-amd64.tar.gz.sha256
          cp "$GITHUB_WORKSPACE/deploy/docker/compose.yaml" compose.yaml
          cp "$GITHUB_WORKSPACE/deploy/kubernetes/kiarni.yaml" kiarni.yaml
          sha256sum kiarni-development-linux-amd64.tar.gz compose.yaml kiarni.yaml > CHECKSUMS.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-linux-amd64
          path: |
            ${{ runner.temp }}/kiarni-development-linux-amd64.tar.gz
            ${{ runner.temp }}/kiarni-development-linux-amd64.tar.gz.sha256
            ${{ runner.temp }}/CHECKSUMS.sha256
            ${{ runner.temp }}/compose.yaml
            ${{ runner.temp }}/kiarni.yaml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
